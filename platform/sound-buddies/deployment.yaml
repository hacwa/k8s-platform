apiVersion: apps/v1
kind: Deployment
metadata:
  name: sound-buddies
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: sound-buddies
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sound-buddies
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sound-buddies
    spec:
      terminationGracePeriodSeconds: 10
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: fetch-site
          image: alpine:3.24
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              wget -qO- \
                https://github.com/dickravison/sound-buddies/archive/6a2901f64c512745ebc10a7e1f2a765f874b0fbd.tar.gz \
                | tar -xz -C /site --strip-components=1
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: site
              mountPath: /site

      containers:
        - name: nginx
          image: nginx:1.29.8-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true

      volumes:
        - name: site
          emptyDir: {}
