apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slurm-auth
  namespace: slurm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: slurm-auth
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: slurm.key
    remoteRef:
      key: hacwa_aws_secrets
      property: slurm-auth-key
      decodingStrategy: None
      conversionStrategy: Default
      metadataPolicy: None
  - secretKey: jwt.key
    remoteRef:
      key: hacwa_aws_secrets
      property: slurm-jwt-key
      decodingStrategy: None
      conversionStrategy: Default
      metadataPolicy: None
---
