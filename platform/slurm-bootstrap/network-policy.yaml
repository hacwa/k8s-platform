apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-internal
  namespace: slurm
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-web-gateway
  namespace: slurm
spec:
  podSelector:
    matchLabels:
      app: slurm-web-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: envoy-gateway-system
    ports:
    - protocol: TCP
      port: 5011
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: slurm-operator-restapi
  namespace: slurm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: restapi
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: slurm-system
    ports:
    - protocol: TCP
      port: 6820
