apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slurm-controller-state
  namespace: slurm
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: nfs-csi
  resources:
    requests:
      storage: 4Gi
---
