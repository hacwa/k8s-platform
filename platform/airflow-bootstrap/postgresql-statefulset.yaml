apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: airflow-postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: postgresql
spec:
  serviceName: airflow-postgresql
  replicas: 1
  podManagementPolicy: OrderedReady

  updateStrategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/component: postgresql

  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/component: postgresql

    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120

      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: postgresql
          image: docker.io/library/postgres:17.9-bookworm
          imagePullPolicy: IfNotPresent

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false

            capabilities:
              drop:
                - ALL

          env:
            - name: POSTGRES_USER
              value: airflow

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-postgresql-auth
                  key: postgres-password

            - name: POSTGRES_DB
              value: airflow

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

            - name: TZ
              value: Europe/London

            - name: PGTZ
              value: Europe/London

            - name: POSTGRES_INITDB_ARGS
              value: >-
                --encoding=UTF8
                --locale-provider=libc
                --locale=en_US.UTF-8

          args:
            - -c
            - max_connections=100
            - -c
            - shared_buffers=128MB
            - -c
            - effective_cache_size=1GB
            - -c
            - timezone=Europe/London

          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP

          startupProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U airflow -d airflow
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U airflow -d airflow
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - pg_isready -U airflow -d airflow
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: 250m
              memory: 512Mi

            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: airflow-postgresql-data
