apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-postgresql-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: airflow-postgresql-auth
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: postgres-password
      remoteRef:
        key: hacwa_aws_secrets
        property: AIRFLOW_POSTGRESQL_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-runtime-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: airflow-runtime-secrets
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: fernet-key
      remoteRef:
        key: hacwa_aws_secrets
        property: AIRFLOW_FERNET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: api-secret-key
      remoteRef:
        key: hacwa_aws_secrets
        property: AIRFLOW_API_SECRET_KEY
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: jwt-secret
      remoteRef:
        key: hacwa_aws_secrets
        property: AIRFLOW_JWT_SECRET
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: client-secret
      remoteRef:
        key: hacwa_aws_secrets
        property: airflow_oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-metadata
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: airflow-metadata
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      engineVersion: v2
      type: Opaque
      data:
        connection: "postgresql://airflow:{{ .postgresPassword }}@airflow-postgresql:5432/airflow"

  data:
    - secretKey: postgresPassword
      remoteRef:
        key: hacwa_aws_secrets
        property: AIRFLOW_POSTGRESQL_PASSWORD
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
