apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: synapse
  namespace: matrix
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/name: synapse
    app.kubernetes.io/part-of: matrix
spec:
  namespaceSelector:
    matchNames:
      - matrix
  selector:
    matchLabels:
      app.kubernetes.io/name: synapse
      app.kubernetes.io/part-of: matrix
  endpoints:
    - port: metrics
      path: /_synapse/metrics
      interval: 30s
      scrapeTimeout: 10s
