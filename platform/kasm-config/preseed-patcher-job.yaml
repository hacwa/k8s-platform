apiVersion: batch/v1
kind: Job
metadata:
  name: kasm-preseed-patcher
  namespace: kasm
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app.kubernetes.io/name: kasm-preseed-patcher
        app.kubernetes.io/part-of: kasm

    spec:
      restartPolicy: Never
      serviceAccountName: kasm-preseed-patcher

      containers:
        - name: patch-preseed
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent

          command:
            - python3
            - -c

          args:
            - |
              import base64
              import json
              import ssl
              import time
              import urllib.error
              import urllib.request

              PLACEHOLDER = "__KASM_OIDC_CLIENT_SECRET__"

              token_path = (
                  "/var/run/secrets/kubernetes.io/"
                  "serviceaccount/token"
              )
              ca_path = (
                  "/var/run/secrets/kubernetes.io/"
                  "serviceaccount/ca.crt"
              )
              namespace_path = (
                  "/var/run/secrets/kubernetes.io/"
                  "serviceaccount/namespace"
              )

              with open(token_path, encoding="utf-8") as handle:
                  token = handle.read().strip()

              with open(namespace_path, encoding="utf-8") as handle:
                  namespace = handle.read().strip()

              context = ssl.create_default_context(cafile=ca_path)

              api_base = (
                  "https://kubernetes.default.svc"
                  f"/api/v1/namespaces/{namespace}/secrets"
              )

              headers = {
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/json",
              }

              def request_secret(name, attempts=60):
                  url = f"{api_base}/{name}"

                  for attempt in range(1, attempts + 1):
                      request = urllib.request.Request(
                          url,
                          headers=headers,
                          method="GET",
                      )

                      try:
                          with urllib.request.urlopen(
                              request,
                              context=context,
                              timeout=10,
                          ) as response:
                              return json.load(response)

                      except urllib.error.HTTPError as error:
                          if error.code != 404:
                              raise

                      print(
                          f"Waiting for Secret {name} "
                          f"({attempt}/{attempts})"
                      )
                      time.sleep(2)

                  raise RuntimeError(
                      f"Secret {name} did not become available"
                  )

              source = request_secret("kasm-secrets")
              preseed = request_secret("kasm-db-preseed")

              oidc_data = source.get("data", {}).get(
                  "oidc-client-secret"
              )

              if not oidc_data:
                  raise RuntimeError(
                      "kasm-secrets does not contain "
                      "oidc-client-secret"
                  )

              oidc_secret = base64.b64decode(
                  oidc_data
              ).decode("utf-8")

              preseed_data = preseed.get("data", {}).get(
                  "custom_properties.yaml"
              )

              if not preseed_data:
                  raise RuntimeError(
                      "kasm-db-preseed does not contain "
                      "custom_properties.yaml"
                  )

              properties = base64.b64decode(
                  preseed_data
              ).decode("utf-8")

              if PLACEHOLDER in properties:
                  patched = properties.replace(
                      PLACEHOLDER,
                      oidc_secret,
                  )

              elif oidc_secret in properties:
                  print(
                      "Kasm OIDC preseed is already patched."
                  )
                  raise SystemExit(0)

              else:
                  raise RuntimeError(
                      "OIDC secret placeholder is absent from "
                      "kasm-db-preseed"
                  )

              body = json.dumps({
                  "data": {
                      "custom_properties.yaml":
                          base64.b64encode(
                              patched.encode("utf-8")
                          ).decode("ascii")
                  }
              }).encode("utf-8")

              patch_headers = dict(headers)
              patch_headers["Content-Type"] = (
                  "application/merge-patch+json"
              )

              patch_request = urllib.request.Request(
                  f"{api_base}/kasm-db-preseed",
                  data=body,
                  headers=patch_headers,
                  method="PATCH",
              )

              with urllib.request.urlopen(
                  patch_request,
                  context=context,
                  timeout=10,
              ) as response:
                  if response.status not in (200, 201):
                      raise RuntimeError(
                          "Unexpected Kubernetes API response: "
                          f"{response.status}"
                      )

              print(
                  "Kasm OIDC preseed patched successfully."
              )
