apiVersion: batch/v1
kind: Job
metadata:
  name: slurm-accounting-bootstrap
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: '1'
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 2400
  template:
    metadata:
      annotations:
        backup.velero.io/backup-volumes-excludes: workspace
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        node-role.kubernetes.io/worker: ''
      securityContext:
        runAsUser: 401
        runAsGroup: 401
        fsGroup: 401
      containers:
      - name: bootstrap
        image: ghcr.io/slinkyproject/slurmctld:26.05-ubuntu26.04@sha256:2ec467b75fe62221d5d042154e2610c12e0a35a0947f48c940f4a9f0b858b083
        command:
        - /bin/bash
        - -ec
        - |
          set -euo pipefail
          ready=no
          for attempt in $(seq 1 120); do
            if test -s /etc/slurm/slurm.conf && scontrol ping 2>/dev/null | grep -q UP; then
              ready=yes; break
            fi
            sleep 5
          done
          [[ $ready == yes ]] || { echo 'Slurm controller was not ready within 10 minutes'; exit 1; }
          for attempt in $(seq 1 60); do
            if sacctmgr --noheader --parsable2 show cluster hacwa-slurm 2>/dev/null | grep -q '^hacwa-slurm|'; then break; fi
            sacctmgr --immediate add cluster hacwa-slurm || true
            sleep 5
          done
          sacctmgr --noheader --parsable2 show cluster hacwa-slurm | grep -q '^hacwa-slurm|'
          if ! sacctmgr --noheader --parsable2 show account media format=Account | grep -qx media; then
            sacctmgr --immediate add account media Description='Media processing' Organization=HACWA
          fi
          if ! sacctmgr --noheader --parsable2 show user slurm withassoc format=User,Account | grep -q '^slurm|media$'; then
            sacctmgr --immediate add user slurm Account=media Cluster=hacwa-slurm
          fi
          sacctmgr --immediate modify user where Name=slurm set DefaultAccount=media
          mkdir -p /srv/slurm-media/{output,manifests,logs}
          # Repair only the two pilot workers drained by the Docker epilog PATH bug.
          # Preserve maintenance drains and every other failure reason.
          for worker in cpu-0 gpu-0; do
            node_info=$(scontrol show node "$worker" --oneliner)
            if [[ $node_info =~ State=[^[:space:]]*DRAIN ]] &&
              [[ $node_info == *'Reason=Epilog error ['* || $node_info == *'Reason=Epilog error' ]]; then
              printf 'Resuming %s after the repaired Docker epilog\n' "$worker"
              scontrol update NodeName="$worker" State=RESUME
            fi
          done
          worker_ready=no
          for attempt in $(seq 1 120); do
            if sinfo --Node --noheader --format='%T' | grep -Eq '^(idle|mixed|allocated)$'; then worker_ready=yes; break; fi
            sleep 5
          done
          [[ $worker_ready == yes ]] || { sinfo -N -l; echo 'No ready Slurm worker'; exit 1; }
          sbatch --wait --parsable --job-name=slurm-smoke --account=media --partition=media   --nodes=1 --ntasks=1 --cpus-per-task=1 --mem=128M --time=00:02:00   --chdir=/tmp --export=NIL --output=/srv/slurm-media/logs/smoke-%j.log   --wrap='set -eu; test -r /mnt/plex_tv; test -w /srv/slurm-media; hostname'
          gpu_ready=no
          for attempt in $(seq 1 120); do
            if sinfo --Node --noheader --partition=gpu --format='%G|%T' |
              awk -F '|' '$1 ~ /^gpu:1($|[(])/ && $2 ~ /^(idle|mixed|allocated)$/ { ready=1 } END { exit !ready }'; then
              gpu_ready=yes; break
            fi
            sleep 5
          done
          [[ $gpu_ready == yes ]] || { sinfo -N -l; echo 'No ready GPU worker with gpu:1'; exit 1; }
          gpu_job=$(sbatch --wait --parsable --job-name=slurm-gpu-smoke --account=media --partition=gpu \
            --nodes=1 --ntasks=1 --cpus-per-task=1 --gres=gpu:1 --mem=128M --time=00:02:00 \
            --chdir=/tmp --export=NIL --output=/srv/slurm-media/logs/gpu-smoke-%j.log \
            --wrap='set -eu; test -n "${CUDA_VISIBLE_DEVICES:-}"; test -r /mnt/plex_tv; test -w /srv/slurm-media; nvidia-smi --query-gpu=name,uuid,driver_version --format=csv,noheader')
          printf 'GPU smoke job: %s\n' "$gpu_job"
          cat "/srv/slurm-media/logs/gpu-smoke-${gpu_job}.log"
          docker_cpu_job=$(sbatch --wait --parsable --job-name=slurm-docker-hello --account=media --partition=media \
            --nodes=1 --ntasks=1 --cpus-per-task=1 --mem=256M --time=00:05:00 \
            --chdir=/tmp --export=NIL --output=/srv/slurm-media/logs/docker-hello-%j.log \
            --wrap='exec /usr/local/bin/slurm-docker-run alpine:3.23.4@sha256:5b10f432ef3da1b8d4c7eb6c487f2f5a8f096bc91145e68878dd4a5019afde11 sh -ec '\''test "$(id -u)" = 401; test -r /mnt/plex_tv; test -w /srv/slurm-media; printf "Hello world from Docker on Slurm, job %s\n" "$SLURM_JOB_ID" | tee "/srv/slurm-media/output/hello-docker-${SLURM_JOB_ID}.txt"'\''')
          printf 'CPU Docker Hello World job: %s\n' "$docker_cpu_job"
          cat "/srv/slurm-media/logs/docker-hello-${docker_cpu_job}.log"
          docker_gpu_job=$(sbatch --wait --parsable --job-name=slurm-docker-gpu --account=media --partition=gpu \
            --nodes=1 --ntasks=1 --cpus-per-task=1 --gres=gpu:1 --mem=256M --time=00:05:00 \
            --chdir=/tmp --export=NIL --output=/srv/slurm-media/logs/docker-gpu-%j.log \
            --wrap='exec /usr/local/bin/slurm-docker-run ubuntu:26.04@sha256:6a06111c3b0a8600feadb270aec771dc239bf407b25625f93f44ab00e11f4d3c nvidia-smi --query-gpu=name,uuid,driver_version --format=csv,noheader')
          printf 'GPU Docker job: %s\n' "$docker_gpu_job"
          cat "/srv/slurm-media/logs/docker-gpu-${docker_gpu_job}.log"
          sinfo -N -l
          sacctmgr --noheader --parsable2 show user slurm withassoc format=User,Account,Cluster
          printf '\nSlurm accounting, native batch execution, Docker Hello World and Docker GPU access verified.\n'
        env:
        - name: SLURM_JWT
          valueFrom:
            secretKeyRef:
              name: slurm-bootstrap-token
              key: token
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
        volumeMounts:
        - name: config
          mountPath: /etc/slurm
          readOnly: true
        - name: workspace
          mountPath: /srv/slurm-media
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: slurm-workspace
      - name: config
        projected:
          defaultMode: 288
          sources:
          - configMap:
              name: slurm-config
              optional: true
          - secret:
              name: slurm-auth
              items:
              - key: slurm.key
                path: slurm.key
              - key: jwt.key
                path: jwt.key
