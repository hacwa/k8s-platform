[ui]
host=https://slurm.hacwa.co.uk

[agents]
url=http://slurm-web-agent:5012

[authentication]
enabled=yes
method=oidc

[oidc]
issuer=https://keycloak.hacwa.co.uk/realms/master
client_id=slurm-web
client_secret_file=/etc/slurm-web/oidc/client-secret
redirect_uri=https://slurm.hacwa.co.uk/api/oidc/callback
scope=openid profile email
subject_claim=preferred_username
groups_claim=groups
restricted_groups=
    SlurmUsers
    SlurmAdmins
pkce=S256
verify_ssl=yes
