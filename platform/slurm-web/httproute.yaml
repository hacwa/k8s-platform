apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slurm-web
  namespace: slurm
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: external-gateway
    namespace: platform-gateway
    sectionName: https
  hostnames:
  - slurm.hacwa.co.uk
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ''
      kind: Service
      name: slurm-web-gateway
      port: 5011
      weight: 1
