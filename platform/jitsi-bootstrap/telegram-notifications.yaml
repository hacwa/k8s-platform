apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jitsi-telegram
  namespace: jitsi
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: jitsi
    app.kubernetes.io/component: notifications
spec:
  refreshPolicy: Periodic
  refreshInterval: 15m
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: jitsi-telegram
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: jitsi
          app.kubernetes.io/component: notifications
  data:
    - secretKey: bot-token
      remoteRef:
        key: hacwa_aws_secrets
        property: JITSI_TELEGRAM_BOT_TOKEN
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: jitsi-telegram
  namespace: jitsi
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: jitsi
    app.kubernetes.io/component: notifications
    alertmanager-config: jitsi
spec:
  route:
    receiver: jitsi-telegram
    groupBy:
      - alertname
    groupWait: 1s
    groupInterval: 5m
    repeatInterval: 24h
    matchers:
      - name: alertname
        value: JitsiConferenceActive
        matchType: "="
  receivers:
    - name: jitsi-telegram
      telegramConfigs:
        - botToken:
            name: jitsi-telegram
            key: bot-token
          chatID: 265980882
          parseMode: HTML
          sendResolved: false
          message: |-
            <b>Jitsi is in use</b>
            {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
            https://jitsi.hacwa.co.uk
