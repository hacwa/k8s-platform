apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kasm-secrets
  namespace: kasm
spec:
  refreshInterval: 1h
  refreshPolicy: Periodic

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager

  target:
    name: kasm-secrets
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque
      engineVersion: v2
      mergePolicy: Replace

      data:
        manager-token: "{{ .managerToken }}"
        service-token: "{{ .serviceToken }}"
        db-password: "{{ .dbPassword }}"
        admin-password: "{{ .adminPassword }}"
        user-password: "{{ .userPassword }}"
        oidc-client-secret: "{{ .oidcClientSecret }}"

  data:
    - secretKey: managerToken
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_manager_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: serviceToken
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_service_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: dbPassword
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: adminPassword
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_admin_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: userPassword
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_user_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

    - secretKey: oidcClientSecret
      remoteRef:
        key: hacwa_aws_secrets
        property: kasm_oidc_client_secret
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
