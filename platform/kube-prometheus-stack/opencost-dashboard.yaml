    {"annotations":{"list":[]},"editable":true,"graphTooltip":1,"id":null,"links":[],"panels":[{"id":1,"title":"OpenCost scrape available","type":"stat","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":5,"w":6,"x":0,"y":0},"fieldConfig":{"defaults":{"unit":"short"},"overrides":[]},"targets":[{"expr":"max(up{namespace=\"opencost\"})","legendFormat":"up","refId":"A"}],"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"}},{"id":2,"title":"Hourly node cost","type":"stat","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":5,"w":6,"x":6,"y":0},"fieldConfig":{"defaults":{"unit":"currencyUSD"},"overrides":[]},"targets":[{"expr":"sum(node_total_hourly_cost)","legendFormat":"hourly","refId":"A"}],"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"}},{"id":3,"title":"Monthly node cost","type":"stat","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":5,"w":6,"x":12,"y":0},"fieldConfig":{"defaults":{"unit":"currencyUSD"},"overrides":[]},"targets":[{"expr":"sum(node_total_hourly_cost) * 730","legendFormat":"monthly","refId":"A"}],"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"}},{"id":4,"title":"PV hourly cost","type":"stat","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":5,"w":6,"x":18,"y":0},"fieldConfig":{"defaults":{"unit":"currencyUSD"},"overrides":[]},"targets":[{"expr":"sum(pv_hourly_cost)","legendFormat":"storage","refId":"A"}],"options":{"colorMode":"value","graphMode":"area","justifyMode":"auto","orientation":"auto","reduceOptions":{"calcs":["lastNotNull"],"fields":"","values":false},"textMode":"auto"}},{"id":5,"title":"Node hourly cost","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":9,"w":12,"x":0,"y":5},"fieldConfig":{"defaults":{"unit":"currencyUSD"},"overrides":[]},"targets":[{"expr":"node_total_hourly_cost","legendFormat":"{{node}}","refId":"A"}],"options":{"legend":{"calcs":[],"displayMode":"table","placement":"right","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}}},{"id":6,"title":"Monthly CPU cost by namespace","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":9,"w":12,"x":12,"y":5},"fieldConfig":{"defaults":{"unit":"currencyUSD"},"overrides":[]},"targets":[{"expr":"sum(container_cpu_allocation * on (node) group_left node_cpu_hourly_cost) by (namespace) * 730","legendFormat":"{{namespace}}","refId":"A"}],"options":{"legend":{"calcs":[],"displayMode":"table","placement":"right","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}}},{"id":7,"title":"Allocated CPU by namespace","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":9,"w":12,"x":0,"y":14},"fieldConfig":{"defaults":{"unit":"cores"},"overrides":[]},"targets":[{"expr":"sum by (namespace) (container_cpu_allocation)","legendFormat":"{{namespace}}","refId":"A"}],"options":{"legend":{"calcs":[],"displayMode":"table","placement":"right","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}}},{"id":8,"title":"Allocated memory by namespace","type":"timeseries","datasource":{"type":"prometheus","uid":"prometheus"},"gridPos":{"h":9,"w":12,"x":12,"y":14},"fieldConfig":{"defaults":{"unit":"bytes"},"overrides":[]},"targets":[{"expr":"sum by (namespace) (container_memory_allocation_bytes)","legendFormat":"{{namespace}}","refId":"A"}],"options":{"legend":{"calcs":[],"displayMode":"table","placement":"right","showLegend":true},"tooltip":{"mode":"multi","sort":"none"}}}],"refresh":"30s","schemaVersion":40,"tags":["opencost","cost","gitops"],"templating":{"list":[]},"time":{"from":"now-6h","to":"now"},"timezone":"browser","title":"OpenCost","uid":"opencost-monitoring","version":1}
