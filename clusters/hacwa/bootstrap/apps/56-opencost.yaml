apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: opencost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "56"
spec:
  project: default

  source:
    repoURL: https://opencost.github.io/opencost-helm-chart
    chart: opencost
    targetRevision: 2.5.29

    helm:
      releaseName: opencost
      values: |
        opencost:
          prometheus:
            internal:
              enabled: true
              serviceName: kube-prometheus-stack-prometheus
              namespaceName: monitoring
              port: 9090
              scheme: http

          exporter:
            defaultClusterId: eks-cost-lab

            extraEnv:
              CLOUD_PROVIDER: AWS
              CONFIG_PATH: /tmp

            startupProbe:
              failureThreshold: 360

          ui:
            enabled: true

            httpRoute:
              enabled: true
              hostnames:
                - opencost.hacwa.co.uk

              parentRefs:
                - group: gateway.networking.k8s.io
                  kind: Gateway
                  name: external-gateway
                  namespace: platform-gateway
                  sectionName: https

              rules:
                - matches:
                    - path:
                        type: PathPrefix
                        value: /
                  backendRefs:
                    - group: ""
                      kind: Service
                      name: opencost
                      port: 9090
                      weight: 1


          mcp:
            enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: opencost

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
