apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: hacwa-platform-applications
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "09"
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error

  generators:
    - git:
        repoURL: https://github.com/hacwa/k8s-platform.git
        revision: main
        files:
          - path: clusters/hacwa/bootstrap/catalog/foundation/*.yaml
          - path: clusters/hacwa/bootstrap/catalog/workloads/*.yaml

  template:
    metadata:
      name: '{{ .metadata.name }}'
      namespace: argocd
    spec:
      project: default

      # Required by the ApplicationSet CRD before templatePatch rendering.
      # The real destination from each catalog Application replaces this.
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd

  templatePatch: |
    metadata:
      annotations:
    {{ with (dig "metadata" "annotations" (dict) .) }}
    {{ toYaml . | nindent 4 }}
    {{ end }}
      labels:
    {{ with (dig "metadata" "labels" (dict) .) }}
    {{ toYaml . | nindent 4 }}
    {{ end }}
        hacwa.co.uk/application-tier: {{ .path.basename | quote }}
        hacwa.co.uk/sync-wave: {{ dig "argocd.argoproj.io/sync-wave" "99" (dig "metadata" "annotations" (dict) .) | quote }}
        hacwa.co.uk/sync-mode: {{ if hasKey (dig "spec" "syncPolicy" (dict) .) "automated" }}"automatic"{{ else }}"manual"{{ end }}
    spec:
    {{ omit .spec "project" | toYaml | nindent 2 }}

  syncPolicy:
    applicationsSync: create-update
    preserveResourcesOnDeletion: true

  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: hacwa.co.uk/sync-mode
              operator: In
              values:
                - automatic
            - key: hacwa.co.uk/sync-wave
              operator: In
              values:
                - "09"
        - matchExpressions:
            - key: hacwa.co.uk/sync-mode
              operator: In
              values:
                - automatic
            - key: hacwa.co.uk/sync-wave
              operator: In
              values:
                - "10"
