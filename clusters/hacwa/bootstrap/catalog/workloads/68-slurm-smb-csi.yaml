apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm-smb-csi
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '68'
spec:
  project: default
  source:
    repoURL: https://github.com/hacwa/k8s-platform.git
    targetRevision: main
    path: platform/slurm-smb-csi
    helm:
      releaseName: csi-driver-smb
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
