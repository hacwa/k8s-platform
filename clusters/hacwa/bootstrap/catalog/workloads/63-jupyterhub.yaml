apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jupyterhub
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "62"
spec:
  project: default

  sources:
    - repoURL: https://github.com/hacwa/k8s-platform.git
      targetRevision: main
      path: platform/jupyterhub-config
      kustomize:
        commonAnnotations:
          argocd.argoproj.io/sync-wave: "-1"

    - repoURL: https://jupyterhub.github.io/helm-chart/
      chart: jupyterhub
      targetRevision: 4.4.1

      helm:
        releaseName: jupyterhub

        values: |
          hub:
            authenticatePrometheus: false

            networkPolicy:
              ingress:
                - from:
                    - namespaceSelector:
                        matchLabels:
                          kubernetes.io/metadata.name: monitoring
                  ports:
                    - protocol: TCP
                      port: http

            db:
              type: sqlite-pvc
              pvc:
                storageClassName: nfs-csi
                accessModes:
                  - ReadWriteOnce
                storage: 5Gi

            config:
              JupyterHub:
                authenticator_class: generic-oauth
                admin_access: true

              GenericOAuthenticator:
                client_id: jupyterhub

                oauth_callback_url: https://jupyterhub.hacwa.co.uk/hub/oauth_callback

                authorize_url: https://keycloak.hacwa.co.uk/realms/master/protocol/openid-connect/auth
                token_url: https://keycloak.hacwa.co.uk/realms/master/protocol/openid-connect/token
                userdata_url: https://keycloak.hacwa.co.uk/realms/master/protocol/openid-connect/userinfo

                login_service: Keycloak
                username_claim: preferred_username

                scope:
                  - openid
                  - profile
                  - email
                  - groups

                manage_groups: true
                auth_state_groups_key: oauth_user.groups

                allowed_groups:
                  - JupyterHubUsers
                  - JupyterHubAdmins

                admin_groups:
                  - JupyterHubAdmins

                auto_login: true

            extraEnv:
              JUPYTERHUB_KEYCLOAK_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: jupyterhub-auth
                    key: client-secret

            extraConfig:
              00-keycloak-client-secret: |
                import os

                c.GenericOAuthenticator.client_secret = os.environ[
                    "JUPYTERHUB_KEYCLOAK_CLIENT_SECRET"
                ]

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi

          proxy:
            service:
              type: ClusterIP

            https:
              enabled: false

            chp:
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi

          singleuser:
            storage:
              type: static

              static:
                pvcName: jupyterhub-user-home
                subPath: "{username}"

              homeMountPath: /home/jovyan

            cloudMetadata:
              blockWithIptables: false

            networkPolicy:
              enabled: true

              egressAllowRules:
                cloudMetadataServer: false
                dnsPortsCloudMetadataServer: true
                dnsPortsKubeSystemNamespace: true
                dnsPortsPrivateIPs: true
                nonPrivateIPs: true
                privateIPs: true

            cpu:
              guarantee: 0.2
              limit: 2

            memory:
              guarantee: 512M
              limit: 4G

            startTimeout: 600

            profileList:
              - display_name: CPU Notebook
                description: Standard CPU-only JupyterLab environment.
                slug: cpu
                default: true

              - display_name: Shared GPU Notebook
                description: CUDA-enabled PyTorch JupyterLab with one time-sliced NVIDIA GPU allocation.
                slug: gpu
                kubespawner_override:
                  image: quay.io/jupyter/pytorch-notebook:cuda13-latest

                  extra_resource_limits:
                    nvidia.com/gpu: "1"

                  node_selector:
                    node-role.kubernetes.io/gpu: ""

                  tolerations:
                    - key: nvidia.com/gpu
                      operator: Equal
                      value: "true"
                      effect: NoSchedule

          scheduling:
            userScheduler:
              enabled: true
              replicas: 2

          cull:
            enabled: true
            users: false
            timeout: 3600
            every: 600

    - repoURL: https://github.com/hacwa/k8s-platform.git
      targetRevision: main
      path: platform/jupyterhub-route
      kustomize:
        commonAnnotations:
          argocd.argoproj.io/sync-wave: "1"

  destination:
    server: https://kubernetes.default.svc
    namespace: jupyterhub

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
