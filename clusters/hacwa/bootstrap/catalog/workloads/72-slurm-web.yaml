apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: slurm-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '72'
spec:
  project: default
  source:
    repoURL: https://github.com/hacwa/k8s-platform.git
    targetRevision: main
    path: platform/slurm-web
  destination:
    server: https://kubernetes.default.svc
    namespace: slurm
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
