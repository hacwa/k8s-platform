apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm-kubernetes-agent
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "66"
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default

  source:
    repoURL: https://github.com/hacwa/k8s-platform.git
    targetRevision: main
    path: platform/kasm-kubernetes-agent

  destination:
    server: https://kubernetes.default.svc
    namespace: kasm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
