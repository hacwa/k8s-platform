apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubecost
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "60"
spec:
  project: default

  sources:
    - repoURL: https://kubecost.github.io/kubecost/
      chart: kubecost
      targetRevision: 3.2.3

      helm:
        releaseName: kubecost
        values: |
          global:
            clusterId: eks-cost-lab
            defaultStorageClass: proxmox-block
            platforms:
              cicd:
                enabled: true
                skipSanityChecks: true

          kubecostProductConfigs:
            currencyCode: GBP

          aggregator:
            aggregatorDbStorage:
              storageClass: proxmox-block
              storageRequest: 128Gi
            persistentConfigsStorage:
              storageClass: proxmox-block
              storageRequest: 1Gi
            nodeSelector:
              hacwa.co.uk/proxmox-csi: "true"
            serviceMonitor:
              enabled: true
              interval: 30s
              scrapeTimeout: 10s
              additionalLabels:
                release: kube-prometheus-stack

          finopsagent:
            extraEnvVars:
              - name: CLOUD_PROVIDER
                value: AWS
              - name: AWS_PRICING_URL
                value: "https://pricing.us-east-1.amazonaws.com/offers/v1.0/aws/AmazonEC2/current/eu-west-2/index.json"

            metrics:
              enabled: true
              serviceMonitor:
                enabled: true
                namespace: monitoring
                labels:
                  release: kube-prometheus-stack
                interval: 30s
                scrapeTimeout: 10s

          localStore:
            persistentVolume:
              enabled: true
              size: 32Gi
              storageClass: proxmox-block
            nodeSelector:
              hacwa.co.uk/proxmox-csi: "true"

          clusterController:
            enabled: false

          cloudCost:
            enabled: false

          forecasting:
            enabled: true

          networkCosts:
            enabled: false

    - repoURL: https://github.com/hacwa/k8s-platform.git
      targetRevision: main
      path: platform/kubecost-route
      kustomize:
        commonAnnotations:
          argocd.argoproj.io/sync-wave: "1"

  destination:
    server: https://kubernetes.default.svc
    namespace: kubecost

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
