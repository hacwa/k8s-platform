apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kasm-runtime-config
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  project: default

  source:
    repoURL: https://github.com/hacwa/k8s-platform.git
    targetRevision: main
    path: platform/kasm-runtime-config

  destination:
    server: https://kubernetes.default.svc
    namespace: kasm

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
