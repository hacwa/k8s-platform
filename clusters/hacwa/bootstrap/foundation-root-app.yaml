apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hacwa-platform-foundation
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/hacwa/k8s-platform.git
      targetRevision: main
      path: clusters/hacwa/bootstrap/apps
      directory:
        recurse: true
        include: '{00-metallb.yaml,02-gateway-api-crds.yaml,03-cert-manager.yaml,04-cert-manager-config.yaml,05-envoy-gateway-crds.yaml,05-envoy-gateway.yaml,06-gateway-config.yaml,07-argocd-config.yaml,08-argocd-route.yaml}'

    - repoURL: https://github.com/hacwa/k8s-platform.git
      targetRevision: main
      path: clusters/hacwa/bootstrap/catalog/foundation
      directory:
        recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
